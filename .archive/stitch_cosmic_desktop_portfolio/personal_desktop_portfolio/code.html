void main() {

  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    // Deep space background colors
    vec3 color = vec3(0.05, 0.05, 0.1); // Deep navy
    
    // Subtle nebula cloud effect
    float noise = 0.0;
    vec2 cloudUv = uv * 2.0;
    for(float i=1.0; i<4.0; i++) {
        cloudUv += vec2(sin(u_time * 0.1 * i), cos(u_time * 0.08 * i)) * 0.2;
        noise += hash(floor(cloudUv * 5.0)) * (1.0 / i);
    }
    vec3 nebula = vec3(0.1, 0.05, 0.2) * noise * 0.3; // Muted purple nebula
    color += nebula;

    // Distant stars
    float stars = 0.0;
    vec2 starUv = uv * 50.0;
    vec2 id = floor(starUv);
    vec2 gv = fract(starUv) - 0.5;
    float h = hash(id);
    if(h > 0.98) {
        float d = length(gv);
        float size = 0.05 + 0.1 * h;
        float star = smoothstep(size, size * 0.1, d);
        star *= (sin(u_time * 2.0 + h * 10.0) * 0.5 + 0.5); // Twinkle

    // Vignette
    float vignette = 1.0 - smoothstep(0.5, 1.5, length(p));

`;

cursor.innerHTML = catSvg;
document.body.appendChild(cursor);

let mouseX = 0, mouseY = 0;
let isHovering = false;

window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX - 16 + 'px';
    cursor.style.top = mouseY - 16 + 'px';
});

// Cursor animations based on state
const updateCursorState = () => {
    const earL = cursor.querySelector('#ear-l');
    const earR = cursor.querySelector('#ear-r');
    const body = cursor.querySelector('#body');

    // Handle hovering
    const hoveredElement = document.elementFromPoint(mouseX, mouseY);
    const isClickable = hoveredElement && (hoveredElement.tagName === 'BUTTON' || hoveredElement.closest('.draggable') || hoveredElement.tagName === 'A');
    
    if (isClickable && !isHovering) {
        isHovering = true;
        earL.setAttribute('y', '8'); // Ears perk up
        earR.setAttribute('y', '8');
        cursor.style.transform = 'scale(1.2)';

        earL.setAttribute('y', '10');
        earR.setAttribute('y', '10');
        cursor.style.transform = 'scale(1)';
    }

    requestAnimationFrame(updateCursorState);

    cursor.style.transform = isHovering ? 'scale(1.2, 0.8)' : 'scale(1, 0.8)';
});

window.addEventListener('mouseup', () => {
    cursor.style.transform = isHovering ? 'scale(1.2)' : 'scale(1)';
});

})();

  function openWindow(id) {
    const data = windowContent[id] || { title: id.toUpperCase(), content: '<p>File system error: Resource not found.</p>', icon: 'warning' };
    
    // Check if window already exists
    if (document.getElementById(`win-${id}`)) {
        focusWindow(document.getElementById(`win-${id}`));
        return;
    }

    const win = document.createElement('div');
    win.id = `win-${id}`;
    win.className = `absolute pointer-events-auto bg-surface border-2 border-outline-variant shadow-[8px_8px_0px_rgba(0,0,0,0.4)] w-[400px] max-w-[90vw]`;
    win.style.left = `${Math.random() * 50 + 100}px`;
    win.style.top = `${Math.random() * 50 + 100}px`;
    win.style.zIndex = ++activeZIndex;
    
    win.innerHTML = `
      <div class="window-title-bar h-8 bg-outline-variant flex items-center justify-between px-2 cursor-move select-none">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[16px]">${data.icon}</span>
          <span class="font-window-title text-window-title uppercase truncate w-48">${data.title}</span>
        </div>
        <div class="flex gap-1">
          <button class="w-5 h-5 bg-surface-variant border border-outline-variant/50 hover:bg-surface-container-highest flex items-center justify-center text-[12px]">—</button>
          <button class="w-5 h-5 bg-surface-variant border border-outline-variant/50 hover:bg-surface-container-highest flex items-center justify-center text-[12px]">□</button>
          <button onclick="document.getElementById('win-${id}').remove()" class="w-5 h-5 bg-error/80 border border-outline-variant/50 hover:bg-error flex items-center justify-center text-[12px] text-on-error">X</button>
        </div>
      </div>
      <div class="p-window-padding max-h-[400px] overflow-y-auto custom-scrollbar">
        ${data.content}
      </div>
    `;

    win.addEventListener('mousedown', () => focusWindow(win));
    makeDraggable(win);
    windowLayer.appendChild(win);
  }

  function focusWindow(el) {
    el.style.zIndex = ++activeZIndex;
    document.querySelectorAll('[id^="win-"]').forEach(w => w.classList.remove('border-primary'));
    el.classList.add('border-primary');
  }

  function makeDraggable(el) {
    const bar = el.querySelector('.window-title-bar');
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

    bar.onmousedown = dragMouseDown;

    function dragMouseDown(e) {
      e.preventDefault();
      pos3 = e.clientX;
      pos4 = e.clientY;
      document.onmouseup = closeDragElement;
      document.onmousemove = elementDrag;
    }

    function elementDrag(e) {
      e.preventDefault();
      pos1 = pos3 - e.clientX;
      pos2 = pos4 - e.clientY;
      pos3 = e.clientX;
      pos4 = e.clientY;
      el.style.top = (el.offsetTop - pos2) + "px";
      el.style.left = (el.offsetLeft - pos1) + "px";
    }

    function closeDragElement() {
      document.onmouseup = null;
      document.onmousemove = null;
    }
  }
</script>
